name: Release Linux ARM64

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  build-linux-arm64:
    name: Build Linux ARM64
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Sync version
        run: pnpm run version:sync

      - name: Read package version
        id: version
        run: |
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build dashboard
        run: pnpm --filter dashboard build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install cargo-zigbuild
        run: |
          pip3 install ziglang
          cargo install cargo-zigbuild --version 0.23.2 --locked

      - name: Configure Rust linker
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << 'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Build Linux ARM64 binary
        run: cargo zigbuild --release --manifest-path cli/Cargo.toml --target aarch64-unknown-linux-gnu.2.28

      - name: Copy binary
        run: |
          mkdir -p artifacts
          cp cli/target/aarch64-unknown-linux-gnu/release/agent-browser artifacts/agent-browser-linux-arm64
          chmod +x artifacts/agent-browser-linux-arm64

      - name: Verify Linux ARM64 glibc floor
        run: |
          set -euo pipefail
          if objdump -p artifacts/agent-browser-linux-arm64 | grep -E 'GLIBC_2\.([3-9][0-9]|29)'; then
            echo "ERROR: agent-browser-linux-arm64 requires glibc newer than 2.28"
            exit 1
          fi
          objdump -p artifacts/agent-browser-linux-arm64 | sed -n '/Version References:/,$p'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-browser-linux-arm64
          path: artifacts/agent-browser-linux-arm64
          retention-days: 7

  github-release:
    name: Publish GitHub Release Asset
    needs: build-linux-arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: agent-browser-linux-arm64
          path: artifacts

      - name: Extract changelog entry
        run: |
          awk '/<!-- release:start -->/{found=1; next} /<!-- release:end -->/{found=0} found{print}' CHANGELOG.md > /tmp/release-notes.md
          lines=$(wc -l < /tmp/release-notes.md | tr -d ' ')
          if [ "$lines" -lt 2 ]; then
            echo "Error: no release notes found in CHANGELOG.md"
            exit 1
          fi

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build-linux-arm64.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          ASSET="artifacts/agent-browser-linux-arm64"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file /tmp/release-notes.md \
              "$ASSET"
          fi
